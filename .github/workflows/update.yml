name: Auto Update AUR Packages

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  detect-updates:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    outputs:
      any_update: ${{ steps.detect.outputs.any_update }}
      updated_packages: ${{ steps.detect.outputs.updated_packages }}
      updates_json: ${{ steps.detect.outputs.updates_json }}
      failed_packages: ${{ steps.detect.outputs.failed_packages }}
      updated_ref: ${{ steps.capture-ref.outputs.updated_ref }}
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel jq curl git openssh

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Create build user
        run: |
          useradd -m -u 1001 builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Validate package metadata
        run: runuser -u builder -- sh -lc 'cd "$GITHUB_WORKSPACE" && ./scripts/validate-packages.sh'

      - name: Detect upstream updates
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp_output="$GITHUB_WORKSPACE/.github_output_detect"
          rm -f "$tmp_output"
          runuser -u builder -- env GITHUB_OUTPUT="$tmp_output" GITHUB_TOKEN="$GITHUB_TOKEN" sh -lc 'cd "$GITHUB_WORKSPACE" && ./scripts/detect-updates.sh'
          cat "$tmp_output" >> "$GITHUB_OUTPUT"

      - name: Report failed packages
        if: steps.detect.outputs.failed_packages != '[]'
        env:
          FAILED_PACKAGES: ${{ steps.detect.outputs.failed_packages }}
        run: |
          for pkg in $(printf '%s' "$FAILED_PACKAGES" | jq -r '.[]'); do
            echo "::warning title=Package update failed::${pkg} failed to process this run and was skipped"
          done

      - name: Commit updated files to repository
        if: steps.detect.outputs.any_update == 'true'
        env:
          UPDATED_PACKAGES: ${{ steps.detect.outputs.updated_packages }}
        run: runuser -u builder -- env GITHUB_REF="$GITHUB_REF" UPDATED_PACKAGES="$UPDATED_PACKAGES" sh -lc 'cd "$GITHUB_WORKSPACE" && ./scripts/commit-updates.sh'

      - name: Capture updated ref
        if: steps.detect.outputs.any_update == 'true'
        id: capture-ref
        run: |
          tmp_output="$GITHUB_WORKSPACE/.github_output_ref"
          rm -f "$tmp_output"
          runuser -u builder -- env GITHUB_OUTPUT="$tmp_output" sh -lc 'cd "$GITHUB_WORKSPACE" && printf "updated_ref=%s\n" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"'
          cat "$tmp_output" >> "$GITHUB_OUTPUT"

  publish-aur:
    needs: detect-updates
    if: needs.detect-updates.outputs.any_update == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-updates.outputs.updates_json) }}
    steps:
      - name: Install publish tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git openssh

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-updates.outputs.updated_ref }}
          fetch-depth: 0

      - name: Publish package to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: ${{ matrix.package.pkgname }}
          pkgbuild: ./${{ matrix.package.path }}/PKGBUILD
          commit_username: "PaloMiku"
          commit_email: "palomiku@outlook.com"
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ matrix.package.latest }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

  update-readme:
    # 只依赖 detect-updates：README 内容来自仓库提交，AUR 发布失败（如 AUR 维护）不应阻塞 README 更新
    needs: detect-updates
    if: needs.detect-updates.outputs.any_update == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm jq git

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Update package READMEs
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          # checkout 写入的 safe.directory 属于宿主机 HOME；容器内 root 的 git
          # 因仓库属主是宿主机用户而拒绝识别仓库，需要按容器视角补一份
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE" && ./scripts/generate-package-readme.sh

      - name: Commit README changes
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --local user.email "palo-miku@users.noreply.github.com"
          git config --local user.name "PaloMiku Bot"
          git pull --ff-only origin "$BRANCH_NAME"

          # README 含 "Last Updated" 时间戳，--quiet 会永远判定有变更；
          # 用 --exit-code 判断，仅当真实内容变化时才提交
          if git diff --exit-code --quiet -- packages/*/README.md; then
            echo "No README changes to commit"
            exit 0
          fi

          git add packages/*/README.md
          git commit -m "chore: update package READMEs"
          git push
